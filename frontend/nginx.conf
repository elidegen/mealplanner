server {
    listen 80;

    # API-Anfragen an den Backend-Container weiterreichen.
    # "backend" ist der Servicename aus compose.yaml - Docker loest ihn
    # ueber sein internes DNS zur Container-IP auf.
    # Weil Frontend und API damit unter derselben Herkunft laufen,
    # entfaellt CORS im Browser komplett.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # React Router: Pfade wie /meals existieren nicht als Datei.
        # Ohne try_files gibt ein Reload auf /meals einen 404.
        try_files $uri $uri/ /index.html;
    }
}
