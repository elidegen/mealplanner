server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Textbasierte Antworten komprimiert ausliefern. Bilder und Fonts im
    # woff2-Format sind bereits komprimiert und fehlen hier bewusst.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/ttf;

    # API-Anfragen an den Backend-Container weiterreichen.
    # "backend" ist der Servicename aus compose.yaml - Docker loest ihn
    # ueber sein internes DNS zur Container-IP auf.
    # Weil Frontend und API damit unter derselben Herkunft laufen,
    # entfaellt CORS im Browser komplett.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite haengt jedem Asset einen Inhalts-Hash an den Dateinamen. Aendert
    # sich der Inhalt, aendert sich der Name - diese Dateien koennen also
    # unbegrenzt gecacht werden, ohne dass ein Deploy veraltet ausgeliefert wird.
    location /assets/ {
        # Alles in einem Header - ein zusaetzliches "expires" wuerde ein
        # zweites Cache-Control danebensetzen.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html verweist auf die gehashten Dateinamen und ist selbst nicht
    # gehasht. Sie darf deshalb nie aus dem Cache kommen, sonst zeigt der
    # Browser nach einem Deploy weiter auf die alten Assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        # React Router: Pfade wie /meals existieren nicht als Datei.
        # Ohne try_files gibt ein Reload auf /meals einen 404.
        try_files $uri $uri/ /index.html;
    }
}
